name: Update Building Product Prices

on:
  schedule:
    # Esegue lo script ogni giorno alle 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Consente l'avvio manuale dal pannello di controllo di GitHub Actions

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-level: '3.x'
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: |
          python equogen/scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add equogen/prices.json
          
          # Verifica se ci sono modifiche prima di fare il commit per evitare errori
          if git diff --staged --quiet; then
            echo "Nessuna modifica rilevata nei prezzi."
          else
            git commit -m "chore: auto-update building materials prices [skip ci]"
            git push origin main
          fi
